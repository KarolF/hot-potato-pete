name: Hot Potato Pete quality

on:
  push:
    paths: ['**', '.github/workflows/hot-potato-pete.yml']
  pull_request:
    paths: ['**', '.github/workflows/hot-potato-pete.yml']

permissions:
  contents: read

jobs:
  web:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node: ['22.19.0', '24']
    defaults:
      run:
        working-directory: .
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
          cache: npm
          cache-dependency-path: package-lock.json
      - run: npm ci
      - run: npm run verify
      - run: npm audit --omit=dev --audit-level=moderate
